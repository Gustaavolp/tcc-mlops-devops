version: 0.2

phases:
  build:
    commands:
      # =============================================================================
      # CLEANUP - Orphan IAM Resources
      # =============================================================================
      - echo "=== Limpando recursos IAM orfaos ==="

      # Limpar role orfao do EKS Node Group antigo (DEV)
      - echo "Limpando role orfao general-eks-node-group-20251210185742346300000001..."
      - |
        ORPHAN_ROLE="general-eks-node-group-20251210185742346300000001"
        for policy in CloudWatchAgentServerPolicy AmazonSSMManagedInstanceCore AmazonKinesisFirehoseFullAccess CloudWatchFullAccess AmazonSQSFullAccess AmazonEKS_CNI_Policy AmazonEC2ContainerRegistryReadOnly AmazonS3ReadOnlyAccess AmazonDynamoDBFullAccess AmazonEKSWorkerNodePolicy; do
          echo "  Detaching $policy from $ORPHAN_ROLE..."
          aws iam detach-role-policy --role-name $ORPHAN_ROLE --policy-arn "arn:aws:iam::aws:policy/$policy" 2>/dev/null || true
        done
      - |
        ORPHAN_ROLE="general-eks-node-group-20251210185742346300000001"
        # Remove from instance profiles
        PROFILES=$(aws iam list-instance-profiles-for-role --role-name $ORPHAN_ROLE --query 'InstanceProfiles[].InstanceProfileName' --output text 2>/dev/null || echo "")
        for profile in $PROFILES; do
          echo "  Removing role from instance profile: $profile"
          aws iam remove-role-from-instance-profile --instance-profile-name $profile --role-name $ORPHAN_ROLE 2>/dev/null || true
        done
      - |
        ORPHAN_ROLE="general-eks-node-group-20251210185742346300000001"
        echo "  Deletando role $ORPHAN_ROLE..."
        aws iam delete-role --role-name $ORPHAN_ROLE 2>/dev/null && echo "  Role deletado com sucesso!" || echo "  Role nao encontrado ou ja deletado"

      # Remover policy redundante SageMakerMLflowAccess (inline antiga)
      - echo "Removendo policy redundante SageMakerMLflowAccess de elo-fraud-eks-node-role-dev..."
      - |
        aws iam delete-role-policy --role-name elo-fraud-eks-node-role-dev --policy-name SageMakerMLflowAccess 2>/dev/null && echo "  Policy removida!" || echo "  Policy nao existe"

      - echo "=== Limpeza concluida ==="

      # =============================================================================
      # DEV Environment - IAM Policies
      # =============================================================================
      - echo "=== Configurando DEV Environment ==="

      - echo "Atualizando policy SageMaker MLflow para DEV..."
      - |
        aws iam put-role-policy \
          --role-name elo-fraud-eks-node-role-dev \
          --policy-name SageMakerMLflowFullAccess \
          --policy-document '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "SageMakerMLflowFullAccess",
                "Effect": "Allow",
                "Action": [
                  "sagemaker:*",
                  "sagemaker-mlflow:*"
                ],
                "Resource": "*"
              }
            ]
          }'
      - echo "Policy SageMaker MLflow DEV atualizada com sucesso!"

      - echo "Garantindo CloudWatchFullAccess para DEV..."
      - |
        aws iam detach-role-policy \
          --role-name elo-fraud-eks-node-role-dev \
          --policy-arn arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy 2>/dev/null || true
      - |
        aws iam attach-role-policy \
          --role-name elo-fraud-eks-node-role-dev \
          --policy-arn arn:aws:iam::aws:policy/CloudWatchFullAccess || true
      - echo "CloudWatchFullAccess DEV anexada com sucesso!"

      - echo "Garantindo ElasticLoadBalancingFullAccess para DEV..."
      - |
        aws iam attach-role-policy \
          --role-name elo-fraud-eks-node-role-dev \
          --policy-arn arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess || true
      - echo "ElasticLoadBalancingFullAccess DEV anexada com sucesso!"

      - echo "Adicionando EC2FullAccess inline policy para DEV (AWS LB Controller)..."
      - |
        aws iam put-role-policy \
          --role-name elo-fraud-eks-node-role-dev \
          --policy-name EC2FullAccess \
          --policy-document '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "EC2FullAccess",
                "Effect": "Allow",
                "Action": "ec2:*",
                "Resource": "*"
              }
            ]
          }'
      - echo "EC2FullAccess DEV adicionada com sucesso!"

      # =============================================================================
      # STAGING Environment - IAM Policies
      # =============================================================================
      - echo "=== Configurando STAGING Environment ==="

      - echo "Atualizando policy SageMaker MLflow para STAGING..."
      - |
        aws iam put-role-policy \
          --role-name elo-fraud-eks-node-role-staging \
          --policy-name SageMakerMLflowFullAccess \
          --policy-document '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "SageMakerMLflowFullAccess",
                "Effect": "Allow",
                "Action": [
                  "sagemaker:*",
                  "sagemaker-mlflow:*"
                ],
                "Resource": "*"
              }
            ]
          }'
      - echo "Policy SageMaker MLflow STAGING atualizada com sucesso!"

      - echo "Garantindo CloudWatchFullAccess para STAGING..."
      - |
        aws iam detach-role-policy \
          --role-name elo-fraud-eks-node-role-staging \
          --policy-arn arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy 2>/dev/null || true
      - |
        aws iam attach-role-policy \
          --role-name elo-fraud-eks-node-role-staging \
          --policy-arn arn:aws:iam::aws:policy/CloudWatchFullAccess || true
      - echo "CloudWatchFullAccess STAGING anexada com sucesso!"

      - echo "Garantindo ElasticLoadBalancingFullAccess para STAGING..."
      - |
        aws iam attach-role-policy \
          --role-name elo-fraud-eks-node-role-staging \
          --policy-arn arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess || true
      - echo "ElasticLoadBalancingFullAccess STAGING anexada com sucesso!"

      - echo "Adicionando EC2FullAccess inline policy para STAGING (AWS LB Controller)..."
      - |
        aws iam put-role-policy \
          --role-name elo-fraud-eks-node-role-staging \
          --policy-name EC2FullAccess \
          --policy-document '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "EC2FullAccess",
                "Effect": "Allow",
                "Action": "ec2:*",
                "Resource": "*"
              }
            ]
          }'
      - echo "EC2FullAccess STAGING adicionada com sucesso!"

      - echo "=== Build concluido com sucesso! ==="
