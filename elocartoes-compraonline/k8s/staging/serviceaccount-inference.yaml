# =============================================================================
# ServiceAccount - Inference Service
# =============================================================================
# ServiceAccount para o serviço de inferência de detecção de fraude.
#
# Permissões: Herdadas do EKS Node Role (managed policies):
#   - AmazonDynamoDBFullAccess (histórico de transações)
#   - AmazonSageMakerFullAccess (invocação de modelo)
#   - AmazonS3ReadOnlyAccess (artefatos de modelo)
#
# Nota: IRSA não disponível devido a restrições SCP em iam:CreateOpenIDConnectProvider
# Pods herdam permissões do Node IAM Role.
#
# Aplicar: kubectl apply -f serviceaccount-inference.yaml
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-service
  namespace: fraud-detection
  labels:
    app: inference
    component: fraud-detection
    environment: staging
    project: elo-fraud
    managed-by: kubectl
  annotations:
    description: "ServiceAccount para serviço de inferência de detecção de fraude"
    # Annotation IRSA iria aqui se o OIDC provider estivesse disponível:
    # eks.amazonaws.com/role-arn: arn:aws:iam::888577064416:role/inference-irsa-role
---
# =============================================================================
# Role - Permissões do Inference Service
# =============================================================================
# Permissões RBAC Kubernetes para o serviço de inferência dentro do namespace.
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-role
  namespace: fraud-detection
  labels:
    app: inference
    environment: staging
rules:
  # Leitura de ConfigMaps para configuração
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Leitura de Secrets para credenciais (se necessário)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Events para debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
# =============================================================================
# RoleBinding - Vincula Role ao ServiceAccount
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-rolebinding
  namespace: fraud-detection
  labels:
    app: inference
    environment: staging
subjects:
  - kind: ServiceAccount
    name: inference-service
    namespace: fraud-detection
roleRef:
  kind: Role
  name: inference-role
  apiGroup: rbac.authorization.k8s.io
