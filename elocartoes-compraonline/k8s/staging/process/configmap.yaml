# =============================================================================
# ConfigMap - Process Service (STAGING)
# =============================================================================
# Configuracoes para o servico process (consumer SQS).
# Valores derivados dos recursos de infraestrutura (DynamoDB, SQS, Firehose).
#
# Aplicar: kubectl apply -f configmap.yaml -n fraud-detection
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: process-config
  namespace: fraud-detection
  labels:
    app: process
    component: fraud-detection
    environment: staging
    project: elo-fraud
data:
  # Configuracao AWS
  AWS_REGION: "sa-east-1"

  # Configuracao SQS
  SQS_QUEUE_URL: "https://sqs.sa-east-1.amazonaws.com/888577064416/elo-fraud-resultset-staging.fifo"

  # Configuracao DynamoDB
  DYNAMO_TABLE: "elo-fraud-customer-recent-tx-staging"

  # Configuracao Firehose
  FIREHOSE_STREAM: "elo-fraud-inference-firehose-staging"
