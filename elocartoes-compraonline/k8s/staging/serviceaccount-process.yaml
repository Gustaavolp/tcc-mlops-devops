# =============================================================================
# ServiceAccount - Process Service
# =============================================================================
# ServiceAccount para o serviço process de detecção de fraude (consumer SQS).
#
# Permissões: Herdadas do EKS Node Role (managed policies):
#   - AmazonSQSFullAccess (consumir fila de resultados)
#   - AmazonDynamoDBFullAccess (atualizar registros de transações)
#   - AmazonS3FullAccess (leitura/escrita de dados de feedback)
#
# Nota: IRSA não disponível devido a restrições SCP em iam:CreateOpenIDConnectProvider
# Pods herdam permissões do Node IAM Role.
#
# Aplicar: kubectl apply -f serviceaccount-process.yaml
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: process-service
  namespace: fraud-detection
  labels:
    app: process
    component: fraud-detection
    environment: staging
    project: elo-fraud
    managed-by: kubectl
  annotations:
    description: "ServiceAccount para serviço process de detecção de fraude (consumer SQS)"
    # Annotation IRSA iria aqui se o OIDC provider estivesse disponível:
    # eks.amazonaws.com/role-arn: arn:aws:iam::888577064416:role/process-irsa-role
---
# =============================================================================
# Role - Permissões do Process Service
# =============================================================================
# Permissões RBAC Kubernetes para o serviço process dentro do namespace.
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: process-role
  namespace: fraud-detection
  labels:
    app: process
    environment: staging
rules:
  # Leitura de ConfigMaps para configuração
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Leitura de Secrets para credenciais (se necessário)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Events para debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leases para leader election (se usando múltiplas réplicas)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# =============================================================================
# RoleBinding - Vincula Role ao ServiceAccount
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: process-rolebinding
  namespace: fraud-detection
  labels:
    app: process
    environment: staging
subjects:
  - kind: ServiceAccount
    name: process-service
    namespace: fraud-detection
roleRef:
  kind: Role
  name: process-role
  apiGroup: rbac.authorization.k8s.io
